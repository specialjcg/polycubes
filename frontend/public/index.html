<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polycubes</title>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
  <script type="module" src="polycube-scene.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f3efe8; color: #2b241c; }
    main { padding: 16px; max-width: 1100px; margin: 0 auto; }
    h1 { font-weight: 600; margin: 0 0 12px; }
    .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .controls label { display: flex; gap: 12px; align-items: center; }
    button { font: inherit; padding: 6px 14px; border: 1px solid #8a7a66; border-radius: 6px; background: #fffaf2; cursor: pointer; }
    .status { margin: 12px 0; font-variant-numeric: tabular-nums; }
    nav { display: flex; gap: 8px; margin: 0 0 16px; }
    .tab.shown { background: #2b241c; color: #fffaf2; }
    h2 { font-size: 1.05rem; font-weight: 600; margin: 16px 0 4px; }
    .explanation { margin: 0 0 8px; min-height: 3em; color: #5c4f40; }
    .side-by-side { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .side-by-side polycube-scene { height: 440px; }
    .enumeration polycube-scene { height: 400px; }
    .error { color: #a3261a; }
    .legend { display: flex; gap: 20px; flex-wrap: wrap; margin: 8px 0; padding: 0; list-style: none; }
    .legend li::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; box-sizing: border-box; }
    .legend .placed::before { background: #d39254; border: 1px solid #3c2818; }
    .legend .candidate::before { background: rgba(47, 143, 107, 0.35); border: 1px solid #2f8f6b; }
    .legend .discarded::before { border: 1px solid #a3261a; }
    .counts { border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .counts th, .counts td { padding: 4px 14px; border: 1px solid #d8cfc0; text-align: right; }
    .counts .current { background: #f0c08a; }
    polycube-scene { display: block; height: 560px; border: 1px solid #d8cfc0; border-radius: 8px; background: #fbf8f2; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="main.js"></script>
  <script src="backend.js"></script>
</body>
</html>
